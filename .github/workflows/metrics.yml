name: Metrics

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: prashantpiyush1111-profile-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: prashantpiyush1111
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: no
          config_display: large

      - name: Streak card
        run: bash scripts/fetch_streak_card.sh

      - name: Commit and push streak cards
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update streak cards"
          fi
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed; retrying after 3s"
            sleep 3
          done
          echo "All push attempts failed" >&2
          exit 1
